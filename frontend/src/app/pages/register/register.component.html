<div class="auth-layout auth-layout--signup">

  <!-- Panneau gauche : formulaire -->
  <div class="auth-panel auth-panel--form">
    <div class="form-wrapper">

      <p class="form-eyebrow">CRÉER UN COMPTE</p>
      <h1 class="form-title">Rejoindre <em>l'atelier</em>.</h1>

      <form (ngSubmit)="onRegister()" novalidate>

        <div class="field-group">
          <label class="field-label" for="reg-name">NOM</label>
          <input
            id="reg-name"
            class="field-input"
            type="text"
            [(ngModel)]="name"
            name="name"
            autocomplete="name"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="reg-email">EMAIL</label>
          <input
            id="reg-email"
            class="field-input"
            type="email"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="reg-username">NOM D'UTILISATEUR</label>
          <input
            id="reg-username"
            class="field-input"
            type="text"
            [(ngModel)]="username"
            name="username"
            autocomplete="username"
            required
          />
        </div>

       <div class="field-group">
  <label class="field-label" for="reg-password">MOT DE PASSE</label>
  <div class="password-wrapper">
    <input
      id="reg-password"
      class="field-input"
      [type]="showPassword ? 'text' : 'password'"
      [(ngModel)]="password"
      name="password"
      autocomplete="new-password"
      required
    />
    <span class="password-eye" (click)="togglePassword()">
      <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.6 18.6 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/>
        <line x1="1" y1="1" x2="23" y2="23"/>
      </svg>
    </span>
  </div>
</div>

        <button class="btn-submit" type="submit">
          Commencer <span class="btn-arrow">→</span>
        </button>

      </form>

      <p class="form-footer-link" *ngIf="successMessage">
        <span class="msg msg--success">{{ successMessage }}</span>
      </p>

      <p class="form-footer-link" *ngIf="errorMessage">
        <span class="msg msg--error">{{ errorMessage }}</span>
      </p>

      <p class="form-footer-link">
        Déjà inscrit ?&nbsp;<a routerLink="/login">Se connecter</a>
      </p>

    </div>
  </div>

  <!-- Panneau droit : branding clair -->
  <!-- Panneau droit : branding clair -->
<div class="auth-panel auth-panel--brand auth-panel--sage">
  
  <!-- Image au milieu -->
  <div class="brand-image-wrapper">
    <img src="images/2.jpeg" alt="Sign Up" class="brand-image" />
  </div>

  
</div>

</div>
