<div class="auth-layout">

  <div class="auth-panel auth-panel--brand">
    <div class="brand-logo">Loci.</div>
    <div class="brand-image-wrapper">
      <img src="images/1.jpeg" alt="Reset" class="brand-image" />
    </div>
    <div class="brand-bottom">
      <blockquote class="brand-quote">"Retrouve<br>ton chemin."</blockquote>
      <span class="brand-tag">ACCÈS · 01</span>
    </div>
  </div>

  <div class="auth-panel auth-panel--form">
    <div class="form-wrapper">

      <p class="form-eyebrow">MOT DE PASSE OUBLIÉ</p>
      <h1 class="form-title">Réinitialiser.</h1>

      <form (ngSubmit)="onSubmit()" novalidate>

        <div class="field-group">
          <label class="field-label" for="fp-email">ADRESSE EMAIL</label>
          <input
            id="fp-email"
            class="field-input"
            type="email"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <button class="btn-submit" type="submit">
          Envoyer le code <span class="btn-arrow">→</span>
        </button>

      </form>

      <p class="form-footer-link" *ngIf="errorMessage">
        <span class="msg msg--error">{{ errorMessage }}</span>
      </p>

      <p class="form-footer-link">
        Retour à la connexion ?&nbsp;<a routerLink="/login">Se connecter</a>
      </p>

    </div>
  </div>

</div>
