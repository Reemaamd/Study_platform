<div class="auth-layout">

  <div class="auth-panel auth-panel--brand">
    <div class="brand-logo">Loci.</div>
    <div class="brand-image-wrapper">
      <img src="images/1.jpeg" alt="Verify" class="brand-image" />
    </div>
    <div class="brand-bottom">
      <blockquote class="brand-quote">"Prouve<br>ton identité."</blockquote>
      <span class="brand-tag">ACCÈS · 02</span>
    </div>
  </div>

  <div class="auth-panel auth-panel--form">
    <div class="form-wrapper">

      <p class="form-eyebrow">VÉRIFICATION</p>
      <h1 class="form-title">Ton code.</h1>

      <p class="form-footer-link">
        Code envoyé à <strong>{{ email }}</strong>
      </p>

      <form (ngSubmit)="onSubmit()" novalidate>

        <div class="field-group">
          <label class="field-label" for="vc-code">CODE À 6 CHIFFRES</label>
          <input
            id="vc-code"
            class="field-input"
            type="text"
            [(ngModel)]="code"
            name="code"
            maxlength="6"
            placeholder="______"
            required
          />
        </div>

        <button class="btn-submit" type="submit">
          Vérifier <span class="btn-arrow">→</span>
        </button>

      </form>

      <p class="form-footer-link" *ngIf="errorMessage">
        <span class="msg msg--error">{{ errorMessage }}</span>
      </p>

      <p class="form-footer-link">
        Mauvais email ?&nbsp;<a routerLink="/forgot-password">Recommencer</a>
      </p>

    </div>
  </div>

</div>
