<p>reset-password works!</p>
<div class="auth-layout">

  <div class="auth-panel auth-panel--brand">
    <div class="brand-logo">Loci.</div>
    <div class="brand-image-wrapper">
      <img src="images/1.jpeg" alt="Reset" class="brand-image" />
    </div>
    <div class="brand-bottom">
      <blockquote class="brand-quote">"Nouveau<br>départ."</blockquote>
      <span class="brand-tag">ACCÈS · 03</span>
    </div>
  </div>

  <div class="auth-panel auth-panel--form">
    <div class="form-wrapper">

      <p class="form-eyebrow">NOUVEAU MOT DE PASSE</p>
      <h1 class="form-title">Choisir.</h1>

      <form (ngSubmit)="onSubmit()" novalidate>

        <div class="field-group">
          <label class="field-label" for="rp-password">NOUVEAU MOT DE PASSE</label>
          <div class="password-wrapper">
            <input
              id="rp-password"
              class="field-input"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="newPassword"
              name="newPassword"
              required
            />
            <span class="password-eye" (click)="togglePassword()">
              <svg *ngIf="!showPassword" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a18.6 18.6 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </span>
          </div>
        </div>

        <button class="btn-submit" type="submit">
          Modifier <span class="btn-arrow">→</span>
        </button>

      </form>

      <p class="form-footer-link" *ngIf="errorMessage">
        <span class="msg msg--error">{{ errorMessage }}</span>
      </p>

    </div>
  </div>

</div>
